[workspace]
resolver = "3"
members = [
  "crates/blog-core",
  "crates/blog-generator",
  "crates/blog-client",
  "xtask",
]
default-members = ["crates/blog-core", "crates/blog-generator", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Cai-Tang-www/myBlog-rust"
authors = ["Cai-Tang-www"]

[workspace.dependencies]
anyhow = "1"
askama = "0.14"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
gray_matter = "0.3"
html-escape = "0.2"
percent-encoding = "2"
regex = "1"
js-sys = "0.3"
mime_guess = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny_http = "0.12"
toml = "0.9"
walkdir = "2"
wasm-bindgen = "0.2"
web-sys = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
