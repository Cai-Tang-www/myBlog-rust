<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 1200 240'
    style='background-color: #00000000;'
    width='1200px' height='240px'>

    <style>
@font-face {
  font-family: 'Noto Sans SC';
  font-style: normal;
  font-weight: 900;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='4000ms' fill='remove'
                    values='m0,120 h0 ; m0,120 h1200 ; m0,120 h1200 ; m0,120 h0' keyTimes='0;0.24;0.94;1' />
                    </path>
    <text font-family='"Noto Sans SC", monospace' fill='#16233F' font-size='130'
        dominant-baseline='middle'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            从想法到交付
        </textPath>
    </text>
</svg>
